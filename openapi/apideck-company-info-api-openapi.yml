openapi: 3.2.0
info:
  version: 10.24.12
  title: Apideck Accounting Company Info API
  description: Welcome to the Accounting API.
  contact:
    email: hello@apideck.com
    url: https://developers.apideck.com
  x-logo:
    url: https://developers.apideck.com/icon.png
  x-apideck-api: accounting
  x-apideck-sdk-support: true
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://unify.apideck.com
security:
- apiKey: []
tags:
- name: Company Info
  description: Company Info contains the organization's profile data including legal name, addresses, tax identifiers, currency, and fiscal year settings.
  x-apideck-resource-id: company-info
  x-apideck-model:
    $ref: '#/components/schemas/CompanyInfo'
paths:
  /accounting/company-info:
    get:
      tags:
      - Company Info
      operationId: companyInfoOne
      summary: Apideck Get company info
      description: Get company info
      x-apideck-gotchas:
      - connector: campfire
        description: 'Campfire does not have a dedicated company info endpoint. This operation returns the first

          entity (subsidiary) from the entities list. For multi-entity accounts, use the subsidiaries

          endpoint to get all entities.

          '
      parameters:
      - $ref: '#/components/parameters/raw'
      - $ref: '#/components/parameters/consumerId'
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/serviceId'
      - $ref: '#/components/parameters/companyId'
      - $ref: '#/components/parameters/fields'
      security:
      - apiKey: []
      responses:
        '200':
          $ref: '#/components/responses/GetCompanyInfoResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '402':
          $ref: '#/components/responses/PaymentRequiredResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/UnprocessableResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      x-apideck-api: accounting
      x-codeSamples:
      - lang: TypeScript
        label: Node
        source: {}
