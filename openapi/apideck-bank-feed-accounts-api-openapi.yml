      x-apideck-schema-id: BankFeedAccount
      additionalProperties: false
      x-apideck-weights:
        id: critical
        bank_account_type: high
        source_account_id: high
        target_account_id: high
        target_account_name: high
        target_account_number: high
        currency: medium
        feed_status: medium
        country: medium
        created_at: low
        updated_at: low
        updated_by: low
        created_by: low
      required:
