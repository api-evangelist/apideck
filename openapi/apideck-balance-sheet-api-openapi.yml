openapi: 3.2.0
info:
  version: 10.24.12
  title: Apideck Accounting Balance Sheet API
  description: Welcome to the Accounting API.
  contact:
    email: hello@apideck.com
    url: https://developers.apideck.com
  x-logo:
    url: https://developers.apideck.com/icon.png
  x-apideck-api: accounting
  x-apideck-sdk-support: true
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://unify.apideck.com
security:
- apiKey: []
tags:
- name: Balance Sheet
  description: A Balance Sheet report shows the financial position at a point in time, including totals for assets, liabilities, and equity accounts.
  x-apideck-resource-id: balance-sheet
  x-apideck-model:
    $ref: '#/components/schemas/BalanceSheet'
paths:
  /accounting/balance-sheet:
    get:
      tags:
      - Balance Sheet
      operationId: balanceSheetOne
      summary: Apideck Get BalanceSheet
      description: Get BalanceSheet
      parameters:
      - $ref: '#/components/parameters/consumerId'
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/serviceId'
      - $ref: '#/components/parameters/companyId'
      - $ref: '#/components/parameters/passThrough'
      - $ref: '#/components/parameters/balanceSheetFilter'
      - $ref: '#/components/parameters/raw'
      security:
      - apiKey: []
      x-apideck-gotchas:
      - connector: quickbooks
        description: When using start and end date filters, QuickBooks requires both to be sent. However, the report only reflects the balance sheet situation as of the end date.
      - connector: netsuite
        description: 'NetSuite date filtering resolves `filter[end_date]` to accounting period IDs via SuiteQL, then filters the SOAP request by periods up to that date. This requires the SuiteAnalytics Workbook permission for period resolution. If unavailable, returns all-time data as fallback. For Balance Sheet, only `filter[end_date]` is meaningful (point-in-time snapshot).

          '
      responses:
        '200':
          $ref: '#/components/responses/GetBalanceSheetResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '402':
          $ref: '#/components/responses/PaymentRequiredResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/UnprocessableResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      x-apideck-api: accounting
      x-codeSamples:
      - lang: TypeScript
        label: Node
        source: {}
components:
  schemas:
    Raw:
      title: raw
      type:
      - object
      - 'null'
      x-apideck-schema-id: Raw
      description: Raw response from the integration when raw=true query param is provided
      additionalProperties: true
    BalanceSheet:
      type: object
      x-apideck-schema-id: BalanceSheet
      x-apideck-circular-ref: true
      x-apideck-weights:
        reports: critical
      additionalProperties: false
      required:
      - reports
      properties:
        reports:
          type: array
          x-apideck-schema-id: BalanceSheetReports
          items:
            type: object
            x-apideck-schema-id: BalanceSheetReport
            x-apideck-weights:
              id: medium
              report_name: medium
              start_date: medium
              end_date: critical
              currency: medium
              assets: critical
              liabilities: critical
              equity: critical
              net_assets: high
              custom_mappings: edge-case
              updated_by: edge-case
              created_by: edge-case
              updated_at: low
              created_at: edge-case
              uncategorized_items: edge-case
            additionalProperties: false
            required:
            - end_date
            - assets
            - liabilities
            - equity
            properties:
              id:
                $ref: '#/components/schemas/Id'
              report_name:
                type: string
                description: The name of the report
                title: Report Name
                example: BalanceSheet
              start_date:
                type: string
                description: The start date of the report
                title: Start Date
                pattern: ^\d{4}-\d{2}-\d{2}$
                example: '2017-01-01'
              end_date:
                type: string
                description: The start date of the report
                title: Start Date
                pattern: ^\d{4}-\d{2}-\d{2}$
                example: '2017-01-31'
              currency:
                $ref: '#/components/schemas/Currency'
              assets:
                type: object
                x-apideck-schema-id: BalanceSheetAssetsAccount
                x-apideck-weights:
                  account_id: high
                  name: high
                  value: critical
                  items: medium
                title: Balance Sheet Assets Account
                description: A balance sheet assets account represents the financial position of a company at a specific point in time.
                additionalProperties: false
                properties:
                  account_id:
                    $ref: '#/components/schemas/AccountId'
                  code:
                    $ref: '#/components/schemas/AccountCode'
                  name:
                    $ref: '#/components/schemas/AccountName'
                  value:
                    $ref: '#/components/schemas/Amount'
                  items:
                    $ref: '#/components/schemas/BalanceSheetAccounts'
                example:
                  account_id: '1'
                  code: '1000'
                  name: Assets
                  value: 50000
                  items:
                  - account_id: '101'
                    code: '1100'
                    name: Current Assets
                    value: 20000
                    items:
                    - account_id: '1011'
                      code: '1101'
                      name: Cash and Cash Equivalents
                      value: 10000
                    - account_id: '1012'
                      code: '1102'
                      name: Accounts Receivable
                      value: 5000
                    - account_id: '1013'
                      code: '1103'
                      name: Inventory
                      value: 3000
                    - account_id: '1014'
                      code: '1104'
                      name: Prepaid Expenses
                      value: 2000
                  - account_id: '102'
                    code: '1200'
                    name: Non-Current Assets
                    value: 30000
                    items:
                    - account_id: '1021'
                      code: '1201'
                      name: Property, Plant, and Equipment (PPE)
                      value: 25000
                    - account_id: '1022'
                      code: '1202'
                      name: Intangible Assets
                      value: 5000
                      items:
                      - account_id: '10221'
                        code: '1203'
                        name: Goodwill
                        value: 3000
                      - account_id: '10222'
                        code: '1204'
                        name: Patents
                        value: 2000
              liabilities:
                type: object
                x-apideck-schema-id: BalanceSheetLiabilitiesAccount
                x-apideck-weights:
                  account_id: high
                  name: high
                  value: critical
                  items: medium
                title: Balance Sheet Liabilities Account
                description: A balance sheet liabilities account represents the financial position of a company at a specific point in time.
                additionalProperties: false
                properties:
                  account_id:
                    $ref: '#/components/schemas/AccountId'
                  code:
                    $ref: '#/components/schemas/AccountCode'
                  name:
                    $ref: '#/components/schemas/AccountName'
                  value:
                    $ref: '#/components/schemas/Amount'
                  items:
                    $ref: '#/components/schemas/BalanceSheetAccounts'
                example:
                  account_id: '2'
                  code: '2000'
                  name: Liabilities
                  value: 30000
                  items:
                  - account_id: '201'
                    code: '2100'
                    name: Current Liabilities
                    value: 10000
                    items:
                    - account_id: '2011'
                      code: '2101'
                      name: Accounts Payable
                      value: 4000
                    - account_id: '2012'
                      code: '2102'
                      name: Short-Term Debt
                      value: 2000
                    - account_id: '2013'
                      code: '2103'
                      name: Accrued Expenses
                      value: 1000
                    - account_id: '2014'
                      code: '2104'
                      name: Current Portion of Long-Term Debt
                      value: 3000
                  - account_id: '202'
                    code: '2200'
                    name: Non-Current Liabilities
                    value: 20000
                    items:
                    - account_id: '2021'
                      code: '2201'
                      name: Long-Term Debt
                      value: 15000
                    - account_id: '2022'
                      code: '2202'
                      name: Deferred Tax Liabilities
                      value: 3000
                    - account_id: '2023'
                      code: '2203'
                      name: Pension Liabilities
                      value: 2000
              equity:
                type: object
                x-apideck-schema-id: BalanceSheetEquityAccount
                x-apideck-weights:
                  account_id: high
                  name: high
                  value: critical
                  items: medium
                title: Balance Sheet Equity Account
                description: A balance sheet equity account represents the financial position of a company at a specific point in time.
                additionalProperties: false
                properties:
                  account_id:
                    $ref: '#/components/schemas/AccountId'
                  code:
                    $ref: '#/components/schemas/AccountCode'
                  name:
                    $ref: '#/components/schemas/AccountName'
                  value:
                    $ref: '#/components/schemas/Amount'
                  items:
                    $ref: '#/components/schemas/BalanceSheetAccounts'
                example:
                  account_id: '3'
                  code: '3000'
                  name: Equity
                  value: 20000
                  items:
                  - account_id: '301'
                    code: '3100'
                    name: Common Stock
                    value: 5000
                  - account_id: '302'
                    code: '3200'
                    name: Retained Earnings
                    value: 10000
                  - account_id: '303'
                    code: '3300'
                    name: Additional Paid-In Capital
                    value: 3000
                  - account_id: '304'
                    code: '3400'
                    name: Treasury Stock
                    value: -1000
                  - account_id: '305'
                    code: '3500'
                    name: Other Comprehensive Income
                    value: 3000
              net_assets:
                type: number
                description: The net assets of the balance sheet
                title: Net Assets
                example: 1000
              custom_mappings:
                $ref: '#/components/schemas/CustomMappings'
              updated_by:
                $ref: '#/components/schemas/UpdatedBy'
              created_by:
                $ref: '#/components/schemas/CreatedBy'
              updated_at:
                $ref: '#/components/schemas/UpdatedAt'
              created_at:
                $ref: '#/components/schemas/CreatedAt'
              uncategorized_items:
                type: object
                x-apideck-schema-id: BalanceSheetUncategorizedItemsAccount
                x-apideck-weights:
                  account_id: high
                  name: high
                  value: critical
                  items: medium
                title: Balance Sheet Uncategorized Items Account
                description: A balance sheet uncategorized items account represents the financial position of a company at a specific point in time.
                additionalProperties: false
                properties:
                  account_id:
                    $ref: '#/components/schemas/AccountId'
                  code:
                    $ref: '#/components/schemas/AccountCode'
                  name:
                    $ref: '#/components/schemas/AccountName'
                  value:
                    $ref: '#/components/schemas/Amount'
                  items:
                    $ref: '#/components/schemas/BalanceSheetAccounts'
                example:
                  account_id: '3'
                  code: '3000'
                  name: Uncategorized Items
                  value: 1000
                  items:
                  - account_id: '301'
                    code: '3100'
                    name: not linked account
                    value: 1000
    UpdatedBy:
      type:
      - string
      - 'null'
      title: Updated by
      description: The user who last updated the object.
      example: '12345'
      readOnly: true
    UnexpectedErrorResponse:
      type: object
      x-apideck-schema-id: Error
      properties:
        status_code:
          type: number
          description: HTTP status code
          example: 400
        error:
          type: string
          description: Contains an explanation of the status_code as defined in HTTP/1.1 standard (RFC 7231)
          example: Bad Request
        type_name:
          type: string
          description: The type of error returned
          example: RequestHeadersValidationError
        message:
          type: string
          description: A human-readable message providing more details about the error.
          example: Invalid Params
          x-speakeasy-error-message: true
        detail:
          anyOf:
          - type: string
            example: 'Missing Header: x-apideck-consumer-id'
          - type: object
            x-speakeasy-detail: true
            example:
              missing:
              - x-apideck-consumer-id: required
          description: Contains parameter or domain specific information related to the error and why it occurred.
        ref:
          type: string
          description: Link to documentation of error type
          example: https://developers.apideck.com/errors#unauthorizederror
    AccountId:
      title: Account Id
      description: The unique identifier for the account.
      type: string
      example: '123456'
      readOnly: true
    UnauthorizedResponse:
      type: object
      x-apideck-schema-id: Unauthorized
      properties:
        status_code:
          type: number
          description: HTTP status code
          example: 401
        error:
          type: string
          description: Contains an explanation of the status_code as defined in HTTP/1.1 standard (RFC 7231)
          example: Unauthorized
        type_name:
          type: string
          description: The type of error returned
          example: UnauthorizedError
        message:
          type: string
          description: A human-readable message providing more details about the error.
          example: Unauthorized Request
          x-speakeasy-error-message: true
        detail:
          anyOf:
          - type: string
            example: Missing authentication
          - type: object
            x-speakeasy-detail: true
            properties:
              type:
                type: string
                description: Error type identifier
                example: refresh_token_connector_error
              message:
                type: string
                description: Detailed error message
                example: Token refresh failed
              debug:
                type: object
                description: Debug information including request/response details and OAuth timing metadata
                properties:
                  request:
                    type: object
                    description: HTTP request details
                  response:
                    type: object
                    description: HTTP response details
                  message:
                    type: string
                    description: Error message from downstream provider or network layer
                  code:
                    type: string
                    description: Error code (e.g., ETIMEDOUT, ECONNREFUSED)
                  credentials_expire_at_ms:
                    type: number
                    description: Unix timestamp (milliseconds) when credentials will be deleted if not refreshed. Only present for non-recoverable errors (401, 400). Credentials are preserved indefinitely for recoverable/network errors.
                    example: 1620172800000
                  retry_after_ms:
                    type: number
                    description: Unix timestamp (milliseconds) when token refresh retry is allowed after cooldown period expires.
                    example: 1620000030000
                  cooldown_remaining_ms:
                    type: number
                    description: Milliseconds remaining in cooldown period before retry is allowed.
                    example: 30000
            example:
              type: refresh_token_connector_error
              message: Token refresh failed with 401 error
              debug:
                response:
                  statusCode: 401
                  data:
                    error: invalid_grant
                credentials_expire_at_ms: 1620172800000
                retry_after_ms: 1620000030000
                cooldown_remaining_ms: 30000
          description: Contains parameter or domain specific information related to the error and why it occurred.
        ref:
          type: string
          description: Link to documentation of error type
          example: https://developers.apideck.com/errors#unauthorizederror
    PaymentRequiredResponse:
      type: object
      x-apideck-schema-id: PaymentRequired
      properties:
        status_code:
          type: number
          description: HTTP status code
          example: 402
        error:
          type: string
          description: Contains an explanation of the status_code as defined in HTTP/1.1 standard (RFC 7231)
          example: Payment Required
        type_name:
          type: string
          description: The type of error returned
          example: RequestLimitError
        message:
          type: string
          description: A human-readable message providing more details about the error.
          example: Request Limit Reached
          x-speakeasy-error-message: true
        detail:
          type: string
          description: Contains parameter or domain specific information related to the error and why it occurred.
          example: You have reached your limit of 2000
        ref:
          type: string
          description: Link to documentation of error type
          example: https://developers.apideck.com/errors#requestlimiterror
    CreatedBy:
      type:
      - string
      - 'null'
      title: Created by
      description: The user who created the object.
      example: '12345'
      readOnly: true
    BalanceSheetFilter:
      type: object
      x-apideck-schema-id: BalanceSheetFilter
      example:
        start_date: '2021-01-01'
        end_date: '2021-12-31'
        period_count: 3
        period_type: month
        location_id: '123'
        accounting_method: accrual
      properties:
        start_date:
          type: string
          title: Start date
          description: The start date of the period to include in the resource.
          example: '2021-01-01'
          deprecated: true
        end_date:
          type: string
          title: End date
          description: The end date of the period to include in the resource.
          example: '2021-12-31'
        period_count:
          type: integer
          title: Period count
          description: The number of periods to include in the resource.
          example: 3
        period_type:
          x-apideck-enum-id: balance-sheet.period-type
          type: string
          title: Period type
          description: 'The type of period to include in the resource: month, quarter, year.'
          example: month
          enum:
          - month
          - quarter
          - year
        location_id:
          type: string
          title: Location ID
          description: The ID of the location to include in the resource.
          example: '123'
        accounting_method:
          x-apideck-enum-id: balance-sheet.accounting-method
          type: string
          title: Accounting Method
          description: 'The accounting method used for the report: cash or accrual.'
          example: accrual
          enum:
          - cash
          - accrual
      additionalProperties: false
    GetBalanceSheetResponse:
      type: object
      x-apideck-schema-id: GetBalanceSheetResponse
      required:
      - status_code
      - status
      - service
      - resource
      - operation
      - data
      properties:
        status_code:
          type: integer
          description: HTTP Response Status Code
          example: 200
        status:
          type: string
          description: HTTP Response Status
          example: OK
        service:
          type: string
          description: Apideck ID of service provider
          example: quickbooks
        resource:
          type: string
          description: Unified API resource name
          example: BalanceSheets
        operation:
          type: string
          description: Operation performed
          example: one
        data:
          $ref: '#/components/schemas/BalanceSheet'
        _raw:
          $ref: '#/components/schemas/Raw'
    NotFoundResponse:
      type: object
      x-apideck-schema-id: NotFound
      properties:
        status_code:
          type: number
          description: HTTP status code
          example: 404
        error:
          type: string
          description: Contains an explanation of the status_code as defined in HTTP/1.1 standard (RFC 7231)
          example: Not Found
        type_name:
          type: string
          description: The type of error returned
          example: EntityNotFoundError
        message:
          type: string
          description: A human-readable message providing more details about the error.
          example: Unknown Widget
          x-speakeasy-error-message: true
        detail:
          anyOf:
          - type: string
            example: 'Could not find widget with id: ''123'''
          - type: object
            x-speakeasy-detail: true
            example:
              not_found:
                entity: widget
                id: '123'
          description: Contains parameter or domain specific information related to the error and why it occurred.
        ref:
          type: string
          description: Link to documentation of error type
          example: https://developers.apideck.com/errors#entitynotfounderror
    Id:
      type: string
      title: ID
      description: A unique identifier for an object.
      example: '12345'
      readOnly: true
    UnprocessableResponse:
      type: object
      x-apideck-schema-id: Unprocessable
      properties:
        status_code:
          type: number
          description: HTTP status code
          example: 422
        error:
          type: string
          description: Contains an explanation of the status_code as defined in HTTP/1.1 standard (RFC 7231)
          example: Unprocessable Entity
        type_name:
          type: string
          description: The type of error returned
          example: InvalidStateError
        message:
          type: string
          description: A human-readable message providing more details about the error.
          example: Invalid State
          x-speakeasy-error-message: true
        detail:
          anyOf:
          - type: string
            example: Unprocessable request, please verify your request headers and body.
          - type: object
            x-speakeasy-detail: true
            example:
              error: Unprocessable
              message: Unprocessable request, please verify your request headers and body.
          description: Contains parameter or domain specific information related to the error and why it occurred.
        ref:
          type: string
          description: Link to documentation of error type
          example: https://developers.apideck.com/errors#invalidstateerror
    BalanceSheetAccount:
      type: object
      x-apideck-schema-id: BalanceSheetAccount
      x-apideck-weights:
        account_id: critical
        name: high
        value: critical
        items: medium
      title: Balance Sheet Account
      description: A balance sheet account represents the financial position of a company at a specific point in time.
      additionalProperties: false
      properties:
        account_id:
          $ref: '#/components/schemas/AccountId'
        code:
          $ref: '#/components/schemas/AccountCode'
        name:
          $ref: '#/components/schemas/AccountName'
        value:
          $ref: '#/components/schemas/Amount'
        items:
          $ref: '#/components/schemas/BalanceSheetAccounts'
    BadRequestResponse:
      type: object
      x-apideck-schema-id: BadRequest
      properties:
        status_code:
          type: number
          description: HTTP status code
          example: 400
        error:
          type: string
          description: Contains an explanation of the status_code as defined in HTTP/1.1 standard (RFC 7231)
          example: Bad Request
        type_name:
          type: string
          description: The type of error returned
          example: RequestValidationError
        message:
          type: string
          description: A human-readable message providing more details about the error.
          example: Invalid Params
          x-speakeasy-error-message: true
        detail:
          anyOf:
          - type: string
            example: Missing property foobar
          - type: object
            x-speakeasy-detail: true
            example:
              missing:
              - foobar: required
          description: Contains parameter or domain specific information related to the error and why it occurred.
        ref:
          type: string
          description: Link to documentation of error type
          example: https://developers.apideck.com/errors#requestvalidationerror
        downstream_errors:
          type: array
          description: Contains downstream errors returned from the connector. Only present when type_name is ConnectorExecutionError.
          items:
            type: object
            properties:
              message:
                type: string
                description: Error message from the downstream provider
              detail:
                type: string
                description: Additional error details
              code:
                type: string
                description: Error code from the downstream provider
          example:
          - message: Account code '100' has been archived or deleted
            detail: Each line item must reference a valid account
            code: VALIDATION_ERROR
    Amount:
      title: Amount
      description: The amount or value of the item
      type: number
      example: 1000
      readOnly: true
    AccountName:
      title: Account Name
      description: The name of the account.
      type: string
      example: Current assets
      readOnly: true
    BalanceSheetAccounts:
      type:
      - array
      - 'null'
      x-apideck-schema-id: BalanceSheetAccounts
      x-speakeasy-type-override: any
      title: Balance Sheet Accounts
      description: A list of balance sheet accounts
      items:
        anyOf:
        - $ref: '#/components/schemas/BalanceSheetAccount'
        - $ref: '#/components/schemas/BalanceSheetAccountRecord'
    BalanceSheetAccountRecord:
      type: object
      x-apideck-schema-id: BalanceSheetAccountRecord
      x-apideck-weights:
        account_id: critical
        name: high
        value: critical
        items: medium
      title: Balance Sheet Account Record
      description: A record of a balance sheet account.
      additionalProperties: false
      properties:
        account_id:
          $ref: '#/components/schemas/AccountId'
        code:
          $ref: '#/components/schemas/AccountCode'
        name:
          $ref: '#/components/schemas/AccountName'
        value:
          $ref: '#/components/schemas/Amount'
    AccountCode:
      title: Account Code
      description: The account code of the account
      type: string
      example: '1100'
    UpdatedAt:
      type:
      - string
      - 'null'
      title: Updated at (timestamp)
      description: The date and time when the object was last updated.
      format: date-time
      example: '2020-09-30T07:43:32.000Z'
      readOnly: true
    PassThroughQuery:
      type: object
      additionalProperties: true
      properties:
        example_downstream_property:
          type: string
          description: All passthrough query parameters are passed along to the connector as is (?pass_through[search]=leads becomes ?search=leads)
      example:
        search: San Francisco
    CustomMappings:
      type:
      - object
      - 'null'
      x-apideck-schema-id: CustomMappings
      description: When custom mappings are configured on the resource, the result is included here.
      readOnly: true
      additionalProperties: true
    Currency:
      type:
      - string
      - 'null'
      title: Currency
      description: Indicates the associated currency for an amount of money. Values correspond to [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217).
      example: USD
      x-apideck-enum-id: currencies
      x-apideck-enum-coverage-ignore: true
      enum:
