openapi: 3.2.0
info:
  version: 10.24.12
  title: Apideck Accounting Bank Feed Statements API
  description: Welcome to the Accounting API.
  contact:
    email: hello@apideck.com
    url: https://developers.apideck.com
  x-logo:
    url: https://developers.apideck.com/icon.png
  x-apideck-api: accounting
  x-apideck-sdk-support: true
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://unify.apideck.com
security:
- apiKey: []
tags:
- name: Bank Feed Statements
  description: A Bank Feed Statement contains imported transaction data from a connected bank account, including statement period and transaction details.
  x-apideck-resource-id: bank-feed-statements
  x-apideck-model:
    $ref: '#/components/schemas/BankFeedStatement'
paths:
  /accounting/bank-feed-statements:
    get:
      tags:
      - Bank Feed Statements
      operationId: bankFeedStatementsAll
      summary: Apideck List Bank Feed Statements
      description: List Bank Feed Statements
      parameters:
      - $ref: '#/components/parameters/raw'
      - $ref: '#/components/parameters/consumerId'
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/serviceId'
      - $ref: '#/components/parameters/companyId'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/passThrough'
      - $ref: '#/components/parameters/fields'
      security:
      - apiKey: []
      x-apideck-gotchas: null
      responses:
        '200':
          $ref: '#/components/responses/GetBankFeedStatementsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '402':
          $ref: '#/components/responses/PaymentRequiredResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/UnprocessableResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      x-apideck-api: accounting
      x-codeSamples:
      - lang: TypeScript
        label: Node
        source: {}
    post:
      tags:
      - Bank Feed Statements
      operationId: bankFeedStatementsAdd
      summary: Apideck Create Bank Feed Statement
      description: Create Bank Feed Statement
      parameters:
      - $ref: '#/components/parameters/raw'
      - $ref: '#/components/parameters/consumerId'
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/serviceId'
      - $ref: '#/components/parameters/companyId'
      security:
      - apiKey: []
      x-apideck-gotchas:
      - connector: xero
        description: "In Xero, if a transaction ID has been previously used, the API will reject the entire bank feed statement.\nHowever, if the statement includes multiple transactions and at least one transaction ID is unique, \nthe API will return a success response but will not process the transactions with duplicate IDs.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankFeedStatement'
      responses:
        '201':
          $ref: '#/components/responses/CreateBankFeedStatementResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '402':
          $ref: '#/components/responses/PaymentRequiredResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/UnprocessableResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      x-apideck-api: accounting
      x-codeSamples:
      - lang: TypeScript
        label: Node
        source:
          bankFeedStatement:
            bank_feed_account_id: acc_456
            status: pending
            start_date: '2021-05-01T12:00:00.000Z'
            end_date: '2025-01-31T12:00:00.000Z'
            start_balance: 10500.25
            start_balance_credit_or_debit: debit
            end_balance: 9800.5
            end_balance_credit_or_debit: debit
            transactions:
            - posted_date: '2025-01-15T12:00:00.000Z'
              description: Payment received from ACME Corp
              amount: 250
              credit_or_debit: debit
              source_transaction_id: txn_987
              counterparty: ACME Corp
              reference: INV-2025-01
              transaction_type: payment
  /accounting/bank-feed-statements/{id}:
    get:
      tags:
      - Bank Feed Statements
      operationId: bankFeedStatementsOne
      summary: Apideck Get Bank Feed Statement
      description: Get Bank Feed Statement
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/consumerId'
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/serviceId'
      - $ref: '#/components/parameters/companyId'
      - $ref: '#/components/parameters/raw'
      - $ref: '#/components/parameters/fields'
      security:
      - apiKey: []
      x-apideck-gotchas: null
      responses:
        '200':
          $ref: '#/components/responses/GetBankFeedStatementResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '402':
          $ref: '#/components/responses/PaymentRequiredResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/UnprocessableResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      x-apideck-api: accounting
      x-codeSamples:
      - lang: TypeScript
        label: Node
        source:
          id: id_example
    patch:
      tags:
      - Bank Feed Statements
      operationId: bankFeedStatementsUpdate
      summary: Apideck Update Bank Feed Statement
      description: Update Bank Feed Statement
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/consumerId'
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/serviceId'
      - $ref: '#/components/parameters/raw'
      security:
      - apiKey: []
      x-apideck-gotchas: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankFeedStatement'
      responses:
        '200':
          $ref: '#/components/responses/UpdateBankFeedStatementResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '402':
          $ref: '#/components/responses/PaymentRequiredResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/UnprocessableResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      x-apideck-api: accounting
      x-codeSamples:
      - lang: TypeScript
        label: Node
        source:
          id: id_example
          bankFeedStatement:
            bank_feed_account_id: acc_456
            status: pending
            start_date: '2021-05-01T12:00:00.000Z'
            end_date: '2025-01-31T12:00:00.000Z'
            start_balance: 10500.25
            start_balance_credit_or_debit: debit
            end_balance: 9800.5
            end_balance_credit_or_debit: debit
            transactions:
            - posted_date: '2025-01-15T12:00:00.000Z'
              description: Payment received from ACME Corp
              amount: 250
              credit_or_debit: debit
              source_transaction_id: txn_987
              counterparty: ACME Corp
              reference: INV-2025-01
              transaction_type: payment
    delete:
      tags:
      - Bank Feed Statements
      operationId: bankFeedStatementsDelete
      summary: Apideck Delete Bank Feed Statement
      description: Delete Bank Feed Statement
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/consumerId'
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/serviceId'
      - $ref: '#/components/parameters/raw'
      security:
      - apiKey: []
      x-apideck-gotchas: null
      responses:
        '200':
          $ref: '#/components/responses/DeleteBankFeedStatementResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '402':
          $ref: '#/components/responses/PaymentRequiredResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/UnprocessableResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      x-apideck-api: accounting
      x-codeSamples:
      - lang: TypeScript
        label: Node
        source:
          id: id_example
