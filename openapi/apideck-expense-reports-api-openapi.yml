            status: submitted
            transaction_date: '2021-05-01T12:00:00.000Z'
            posting_date: '2024-06-01'
            due_date: '2024-06-15'
            currency: USD
            currency_rate: 0.69
            sub_total: 250
            total_tax: 25
            total_amount: 1250.75
            reimbursable_amount: 1100
            memo: Business travel expenses for Q1 client meetings
            department:
              display_id: '123456'
              name: Acme Inc.
            location:
              id: '123456'
              display_id: '123456'
              name: New York Office
            account:
              id: '123456'
              name: Bank account
              nominal_code: N091
              code: '453'
              parent_id: '123456'
              display_id: '123456'
            accounting_period:
              id: '12345'
              name: Q1 2024
            line_items:
            - line_number: 1
              expense_category:
                id: '12345'
