openapi: 3.2.0
info:
  version: 10.24.12
  title: Apideck Accounting Expense Reports API
  description: Welcome to the Accounting API.
  contact:
    email: hello@apideck.com
    url: https://developers.apideck.com
  x-logo:
    url: https://developers.apideck.com/icon.png
  x-apideck-api: accounting
  x-apideck-sdk-support: true
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://unify.apideck.com
security:
- apiKey: []
tags:
- name: Expense Reports
  description: An Expense Report is a collection of expense line items submitted by an employee for reimbursement, including amounts, categories, and approval status.
  x-apideck-resource-id: expense-reports
  x-apideck-model:
    $ref: '#/components/schemas/ExpenseReport'
paths:
  /accounting/expense-reports:
    get:
      tags:
      - Expense Reports
      operationId: expenseReportsAll
      summary: Apideck List Expense Reports
      description: List Expense Reports
      parameters:
      - $ref: '#/components/parameters/raw'
      - $ref: '#/components/parameters/consumerId'
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/serviceId'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/expenseReportsFilter'
      security:
      - apiKey: []
      responses:
        '200':
          $ref: '#/components/responses/GetExpenseReportsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '402':
          $ref: '#/components/responses/PaymentRequiredResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/UnprocessableResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      x-apideck-api: accounting
      x-codeSamples:
      - lang: TypeScript
        label: Node
        source: {}
    post:
      tags:
      - Expense Reports
      operationId: expenseReportsAdd
      summary: Apideck Create Expense Report
      description: Create Expense Report
      parameters:
      - $ref: '#/components/parameters/raw'
      - $ref: '#/components/parameters/consumerId'
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/serviceId'
      security:
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseReport'
      responses:
        '201':
          $ref: '#/components/responses/CreateExpenseReportResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '402':
          $ref: '#/components/responses/PaymentRequiredResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/UnprocessableResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      x-apideck-api: accounting
      x-codeSamples:
      - lang: TypeScript
        label: Node
        source:
          expenseReport:
            display_id: '123456'
            number: ER-001
            title: Q1 Business Travel
            employee:
              id: '12345'
              display_name: John Doe
            status: submitted
            transaction_date: '2021-05-01T12:00:00.000Z'
            posting_date: '2024-06-01'
            due_date: '2024-06-15'
            currency: USD
            currency_rate: 0.69
            sub_total: 250
            total_tax: 25
            total_amount: 1250.75
            reimbursable_amount: 1100
            memo: Business travel expenses for Q1 client meetings
            department:
              display_id: '123456'
              name: Acme Inc.
            location:
              id: '123456'
              display_id: '123456'
              name: New York Office
            account:
              id: '123456'
              name: Bank account
              nominal_code: N091
              code: '453'
              parent_id: '123456'
              display_id: '123456'
            accounting_period:
              id: '12345'
              name: Q1 2024
            line_items:
            - line_number: 1
              expense_category:
                id: '12345'
                downstream_id: '12345'
                display_id: Airfare
                name: Airfare
              account:
                id: '123456'
                name: Bank account
                nominal_code: N091
                code: '453'
                parent_id: '123456'
                display_id: '123456'
              description: Flight to New York
              quantity: 1
              unit_price: 27500.5
              amount: 275
              tax_rate:
                id: '123456'
                code: N-T
                rate: 10
              tax_amount: 27.5
              total_amount: 302.5
              transaction_date: '2024-05-15'
              billable: true
              reimbursable: true
              customer:
                id: '12345'
                display_name: Windsurf Shop
                name: Windsurf Shop
                email: boring@boring.com
              department:
                display_id: '123456'
                name: Acme Inc.
              location:
                id: '123456'
                display_id: '123456'
                name: New York Office
              tracking_categories:
              - id: '123456'
                code: '100'
                name: New York
                parent_id: '123456'
                parent_name: New York
              receipt_url: https://example.com/receipts/123.pdf
              currency: USD
            subsidiary:
              display_id: '123456'
              name: Acme Inc.
            tracking_categories:
            - id: '123456'
              code: '100'
              name: New York
              parent_id: '123456'
              parent_name: New York
            tax_inclusive: true
            approved_by:
              id: '12345'
              display_name: Jane Smith
            custom_fields:
            - id: '2389328923893298'
              name: employee_level
              description: Employee Level
              value: Uses Salesforce and Marketo
            row_version: 1-12345
            pass_through:
            - service_id: string
              operation_id: string
              extend_object: {}
              extend_paths:
              - path: $.nested.property
                value:
                  TaxClassificationRef:
                    value: EUC-99990201-V1-00020000
  /accounting/expense-reports/{id}:
    get:
      tags:
      - Expense Reports
      operationId: expenseReportsOne
      summary: Apideck Get Expense Report
      description: Get Expense Report
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/consumerId'
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/serviceId'
      - $ref: '#/components/parameters/raw'
      - $ref: '#/components/parameters/fields'
      security:
      - apiKey: []
      responses:
        '200':
