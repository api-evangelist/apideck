components:
  schemas:
    Raw:
      title: raw
      type:
      - object
      - 'null'
      x-apideck-schema-id: Raw
      description: Raw response from the integration when raw=true query param is provided
      additionalProperties: true
    UpdatedBy:
      type:
      - string
      - 'null'
      title: Updated by
      description: The user who last updated the object.
      example: '12345'
      readOnly: true
    UnitPrice:
      type:
      - number
      - 'null'
      title: Unit price
      example: 27500.5
    TotalTax:
      title: Total tax amount
      description: Total tax amount applied to this transaction.
      type:
      - number
      - 'null'
      example: 25
    LinkedTrackingCategory:
      type:
      - object
      - 'null'
      x-apideck-schema-id: LinkedTrackingCategory
      x-apideck-weights:
        id: critical
        code: medium
      properties:
        id:
          title: Tracking Category ID
          description: The unique identifier for the tracking category.
          type: string
          example: '123456'
        code:
          type:
          - string
          - 'null'
          title: Tracking Category Code
          description: The code of the tracking category.
          example: '100'
        name:
          type:
          - string
          - 'null'
          title: Tracking Category Name
          description: The name of the tracking category.
          example: New York
        parent_id:
          type: string
          title: Parent Tracking Category ID
          description: The unique identifier for the parent tracking category.
          example: '123456'
        parent_name:
          type:
          - string
          - 'null'
          title: Parent Tracking Category Name
          description: The name of the parent tracking category.
          example: New York
    ExpenseReport:
      type: object
      x-apideck-schema-id: ExpenseReport
      additionalProperties: false
      x-apideck-weights:
        id: critical
        display_id: high
        number: medium
        title: high
        employee: critical
        status: critical
        transaction_date: critical
        posting_date: low
        due_date: medium
        currency: high
        currency_rate: edge-case
        sub_total: high
        total_tax: high
        total_amount: critical
        reimbursable_amount: medium
        memo: medium
        department: medium
        location: medium
        account: medium
        accounting_period: low
        line_items: critical
        subsidiary: medium
        tracking_categories: medium
        tax_inclusive: edge-case
        approved_by: low
        custom_fields: medium
        custom_mappings: low
        row_version: low
        updated_by: edge-case
        created_by: edge-case
        updated_at: medium
        created_at: medium
        pass_through: low
      required:
      - employee
      - transaction_date
      - line_items
      x-apideck-strict-required:
      - id
      - employee
      - transaction_date
      - line_items
      - status
      - total_amount
      properties:
        id:
          $ref: '#/components/schemas/Id'
        display_id:
          $ref: '#/components/schemas/DisplayId'
        number:
          type:
          - string
          - 'null'
          title: Number
          description: The expense report number.
          example: ER-001
        title:
          type:
          - string
          - 'null'
          title: Title
          description: Title or purpose of the expense report.
          example: Q1 Business Travel
        employee:
          type: object
          title: Employee
          description: The employee who submitted the expense report.
          properties:
            id:
              type: string
              title: Employee ID
              description: A unique identifier for the employee.
              example: '12345'
            display_name:
              type:
              - string
              - 'null'
              title: Employee Display Name
              description: The display name of the employee.
              example: John Doe
        status:
          type:
          - string
          - 'null'
          title: Status
          description: The status of the expense report.
          x-apideck-enum-id: expense_reports.status
          enum:
          - draft
          - submitted
          - approved
          - reimbursed
          - rejected
          - reversed
          - voided
          example: submitted
        transaction_date:
          $ref: '#/components/schemas/TransactionDate'
        posting_date:
          type:
          - string
          - 'null'
          title: Posting Date
          description: The date the expense report was posted to the general ledger.
          format: date
          example: '2024-06-01'
        due_date:
          type:
          - string
          - 'null'
          title: Due Date
          description: Date when reimbursement is due.
          format: date
          example: '2024-06-15'
        currency:
          $ref: '#/components/schemas/Currency'
        currency_rate:
          $ref: '#/components/schemas/CurrencyRate'
        sub_total:
          $ref: '#/components/schemas/SubTotal'
        total_tax:
          $ref: '#/components/schemas/TotalTax'
        total_amount:
          type:
          - number
          - 'null'
          title: Total Amount
          description: Total amount of all expense lines including tax.
          example: 1250.75
        reimbursable_amount:
          type:
          - number
          - 'null'
          title: Reimbursable Amount
          description: Total reimbursable amount (may differ from total if some expenses are non-reimbursable).
          example: 1100
        memo:
          type:
          - string
          - 'null'
          title: Memo
          description: The memo of the expense report.
          example: Business travel expenses for Q1 client meetings
        department:
          $ref: '#/components/schemas/LinkedDepartment'
        location:
          $ref: '#/components/schemas/LinkedLocation'
        account:
          $ref: '#/components/schemas/LinkedLedgerAccount'
        accounting_period:
          type:
          - object
          - 'null'
          title: Accounting Period
          description: The accounting period the expense report is posted to.
          properties:
            id:
              type: string
              title: Accounting Period ID
              description: A unique identifier for the accounting period.
              example: '12345'
            name:
              type:
              - string
              - 'null'
              title: Accounting Period Name
              description: The name of the accounting period.
              example: Q1 2024
        line_items:
          type: array
          minItems: 1
          description: Expense line items linked to this expense report.
          items:
            $ref: '#/components/schemas/ExpenseReportLineItem'
        subsidiary:
          $ref: '#/components/schemas/LinkedSubsidiary'
        tracking_categories:
          $ref: '#/components/schemas/LinkedTrackingCategories'
        tax_inclusive:
          $ref: '#/components/schemas/TaxInclusive'
        approved_by:
          type:
          - object
          - 'null'
          title: Approved By
          description: The person who approved the expense report.
          properties:
            id:
              type: string
              title: Approver ID
              description: A unique identifier for the approver.
              example: '12345'
            display_name:
              type:
              - string
              - 'null'
              title: Approver Display Name
              description: The display name of the approver.
              example: Jane Smith
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/CustomField'
        custom_mappings:
          $ref: '#/components/schemas/CustomMappings'
        row_version:
          $ref: '#/components/schemas/RowVersion'
        updated_by:
          $ref: '#/components/schemas/UpdatedBy'
        created_by:
          $ref: '#/components/schemas/CreatedBy'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        pass_through:
          $ref: '#/components/schemas/PassThroughBody'
    UnifiedId:
      title: UnifiedId
      type: object
      x-apideck-schema-id: Id
      description: A object containing a unique identifier for the resource that was created, updated, or deleted.
      required:
      - id
      properties:
        id:
          title: Id
          description: The unique identifier of the resource
          type: string
          readOnly: true
          example: '12345'
    LineNumber:
      title: Line number
      type:
      - integer
      - 'null'
      description: Line number of the resource
      example: 1
    UpdateExpenseReportResponse:
      type: object
      required:
      - status_code
      - status
      - service
      - resource
      - operation
      - data
      properties:
        status_code:
          type: integer
          description: HTTP Response Status Code
          example: 200
        status:
          type: string
          description: HTTP Response Status
          example: OK
        service:
          type: string
          description: Apideck ID of service provider
          example: netsuite
        resource:
          type: string
          description: Unified API resource name
          example: ExpenseReports
        operation:
          type: string
          description: Operation performed
          example: update
        data:
          $ref: '#/components/schemas/UnifiedId'
        _raw:
          $ref: '#/components/schemas/Raw'
    LinkedLedgerAccount:
      type:
      - object
      - 'null'
      x-apideck-schema-id: LinkedLedgerAccount
      additionalProperties: false
      x-apideck-weights:
        id: medium
        nominal_code: medium
        code: medium
        name: medium
        parent_id: low
        display_id: low
      properties:
        id:
          title: Account ID
          description: The unique identifier for the account.
          type: string
          example: '123456'
        name:
          type:
          - string
          - 'null'
          title: Account Name
          description: The name of the account.
          example: Bank account
        nominal_code:
          type:
          - string
          - 'null'
          title: Nominal Code
          description: The nominal code of the account.
          example: N091
        code:
          type:
          - string
          - 'null'
          title: Code
          description: The code assigned to the account.
          example: '453'
        parent_id:
          type:
          - string
          - 'null'
          title: Parent ID
          description: The parent ID of the account.
          example: '123456'
        display_id:
          type:
          - string
          - 'null'
          title: Display ID
          description: The display ID of the account.
          example: '123456'
    UnexpectedErrorResponse:
      type: object
      x-apideck-schema-id: Error
      properties:
        status_code:
          type: number
          description: HTTP status code
          example: 400
        error:
          type: string
          description: Contains an explanation of the status_code as defined in HTTP/1.1 standard (RFC 7231)
          example: Bad Request
        type_name:
          type: string
          description: The type of error returned
          example: RequestHeadersValidationError
        message:
          type: string
          description: A human-readable message providing more details about the error.
          example: Invalid Params
          x-speakeasy-error-message: true
        detail:
          anyOf:
          - type: string
            example: 'Missing Header: x-apideck-consumer-id'
          - type: object
            x-speakeasy-detail: true
            example:
              missing:
              - x-apideck-consumer-id: required
          description: Contains parameter or domain specific information related to the error and why it occurred.
        ref:
          type: string
          description: Link to documentation of error type
          example: https://developers.apideck.com/errors#unauthorizederror
    DeleteExpenseReportResponse:
      type: object
      required:
      - status_code
      - status
      - service
      - resource
      - operation
      - data
      properties:
        status_code:
          type: integer
          description: HTTP Response Status Code
          example: 200
        status:
          type: string
          description: HTTP Response Status
          example: OK
        service:
          type: string
          description: Apideck ID of service provider
          example: netsuite
        resource:
          type: string
          description: Unified API resource name
          example: ExpenseReports
        operation:
          type: string
          description: Operation performed
          example: delete
        data:
          $ref: '#/components/schemas/UnifiedId'
        _raw:
          $ref: '#/components/schemas/Raw'
    UnauthorizedResponse:
      type: object
      x-apideck-schema-id: Unauthorized
      properties:
        status_code:
          type: number
          description: HTTP status code
          example: 401
        error:
          type: string
          description: Contains an explanation of the status_code as defined in HTTP/1.1 standard (RFC 7231)
          example: Unauthorized
        type_name:
          type: string
          description: The type of error returned
          example: UnauthorizedError
        message:
          type: string
          description: A human-readable message providing more details about the error.
          example: Unauthorized Request
          x-speakeasy-error-message: true
        detail:
          anyOf:
          - type: string
