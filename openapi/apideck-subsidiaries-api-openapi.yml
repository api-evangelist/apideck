openapi: 3.2.0
info:
  version: 10.24.12
  title: Apideck Accounting Subsidiaries API
  description: Welcome to the Accounting API.
  contact:
    email: hello@apideck.com
    url: https://developers.apideck.com
  x-logo:
    url: https://developers.apideck.com/icon.png
  x-apideck-api: accounting
  x-apideck-sdk-support: true
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://unify.apideck.com
security:
- apiKey: []
tags:
- name: Subsidiaries
  description: A Subsidiary represents a child company within an organization, including name, status, and parent company relationship.
  x-apideck-resource-id: subsidiaries
  x-apideck-model:
    $ref: '#/components/schemas/Subsidiary'
paths:
