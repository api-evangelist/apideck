        period_count: 3
        period_length: 30
      properties:
        customer_id:
          type: string
          title: Customer Id
          description: Filter by customer id
          example: 123abc
        supplier_id:
          type: string
          title: Supplier Id
          description: Filter by supplier id
          example: 123abc
        report_as_of_date:
          type: string
