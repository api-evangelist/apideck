      x-apideck-weights:
        transaction_id: critical
        transaction_date: high
        transaction_type: high
        transaction_number: medium
        due_date: high
        original_amount: high
        outstanding_balance: critical
      properties:
        transaction_id:
          type: string
          title: Transaction ID
