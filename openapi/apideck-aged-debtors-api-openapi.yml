    UnexpectedErrorResponse:
      type: object
      x-apideck-schema-id: Error
      properties:
        status_code:
          type: number
          description: HTTP status code
          example: 400
        error:
          type: string
          description: Contains an explanation of the status_code as defined in HTTP/1.1 standard (RFC 7231)
          example: Bad Request
        type_name:
          type: string
          description: The type of error returned
          example: RequestHeadersValidationError
        message:
          type: string
          description: A human-readable message providing more details about the error.
          example: Invalid Params
          x-speakeasy-error-message: true
        detail:
          anyOf:
          - type: string
            example: 'Missing Header: x-apideck-consumer-id'
          - type: object
            x-speakeasy-detail: true
            example:
              missing:
              - x-apideck-consumer-id: required
          description: Contains parameter or domain specific information related to the error and why it occurred.
        ref:
          type: string
          description: Link to documentation of error type
          example: https://developers.apideck.com/errors#unauthorizederror
    PaymentRequiredResponse:
      type: object
      x-apideck-schema-id: PaymentRequired
      properties:
        status_code:
          type: number
          description: HTTP status code
          example: 402
        error:
          type: string
          description: Contains an explanation of the status_code as defined in HTTP/1.1 standard (RFC 7231)
          example: Payment Required
        type_name:
          type: string
          description: The type of error returned
          example: RequestLimitError
        message:
          type: string
          description: A human-readable message providing more details about the error.
          example: Request Limit Reached
          x-speakeasy-error-message: true
        detail:
          type: string
          description: Contains parameter or domain specific information related to the error and why it occurred.
          example: You have reached your limit of 2000
        ref:
          type: string
          description: Link to documentation of error type
          example: https://developers.apideck.com/errors#requestlimiterror
    ReportAsOfDate:
      type: string
      title: Report As Of Date
      description: The cutoff date for transactions included in the report.
      format: date
      example: '2024-11-13'
    BalanceByPeriod:
      type: object
      title: Balance by Period
      x-apideck-schema-id: BalanceByPeriod
      additionalProperties: false
      x-apideck-weights:
        start_date: high
        end_date: high
        total_amount: critical
        balances_by_transaction: high
      properties:
        start_date:
          type:
          - string
          - 'null'
          title: Start Date
          description: The starting date of the period. If not provided, it represents the oldest period, where all transactions due before the specified `end_date` are included.
          format: date
          example: '2024-01-01'
        end_date:
          type:
          - string
          - 'null'
          title: End Date
          description: The ending date of the period. If not provided, it represents an open-ended period starting from the `start_date`, typically capturing future-dated transactions that are not yet aged.
          format: date
          example: '2024-01-30'
        total_amount:
          type: number
          title: Total Amount
          description: Total amount of the period.
          example: 1500
        balances_by_transaction:
          type: array
          items:
            $ref: '#/components/schemas/BalanceByTransaction'
    NotFoundResponse:
      type: object
      x-apideck-schema-id: NotFound
      properties:
        status_code:
          type: number
          description: HTTP status code
          example: 404
        error:
          type: string
          description: Contains an explanation of the status_code as defined in HTTP/1.1 standard (RFC 7231)
          example: Not Found
        type_name:
          type: string
          description: The type of error returned
          example: EntityNotFoundError
        message:
          type: string
          description: A human-readable message providing more details about the error.
          example: Unknown Widget
          x-speakeasy-error-message: true
        detail:
          anyOf:
          - type: string
            example: 'Could not find widget with id: ''123'''
          - type: object
            x-speakeasy-detail: true
            example:
              not_found:
                entity: widget
                id: '123'
          description: Contains parameter or domain specific information related to the error and why it occurred.
        ref:
          type: string
          description: Link to documentation of error type
          example: https://developers.apideck.com/errors#entitynotfounderror
    PeriodCount:
      type: integer
      title: Period Count
      description: Number of aging periods shown in the report.
      example: 4
      default: 4
    OutstandingBalanceByCustomer:
      type: object
      title: Outstanding Balance
      x-apideck-schema-id: OutstandingBalanceByCustomer
      additionalProperties: false
      x-apideck-weights:
        customer_id: high
        customer_name: high
        outstanding_balances_by_currency: critical
      properties:
        customer_id:
          type: string
          title: Customer ID
          description: Unique identifier for the customer.
          example: '123'
        customer_name:
          type: string
          title: Customer Name
          description: Full name of the customer.
          example: Super Store
        outstanding_balances_by_currency:
          type: array
          items:
            $ref: '#/components/schemas/OutstandingBalanceByCurrency'
    UnprocessableResponse:
      type: object
      x-apideck-schema-id: Unprocessable
      properties:
        status_code:
          type: number
          description: HTTP status code
          example: 422
        error:
          type: string
          description: Contains an explanation of the status_code as defined in HTTP/1.1 standard (RFC 7231)
          example: Unprocessable Entity
        type_name:
          type: string
          description: The type of error returned
          example: InvalidStateError
        message:
          type: string
          description: A human-readable message providing more details about the error.
          example: Invalid State
          x-speakeasy-error-message: true
        detail:
          anyOf:
          - type: string
            example: Unprocessable request, please verify your request headers and body.
          - type: object
            x-speakeasy-detail: true
            example:
              error: Unprocessable
              message: Unprocessable request, please verify your request headers and body.
          description: Contains parameter or domain specific information related to the error and why it occurred.
        ref:
          type: string
          description: Link to documentation of error type
          example: https://developers.apideck.com/errors#invalidstateerror
    GetAgedDebtorsResponse:
      type: object
      x-apideck-schema-id: GetAgedDebtorsResponse
      required:
      - status_code
      - status
      - service
      - resource
      - operation
      - data
      properties:
        status_code:
          type: integer
          description: HTTP Response Status Code
          example: 200
        status:
          type: string
          description: HTTP Response Status
          example: OK
        service:
          type: string
          description: Apideck ID of service provider
          example: quickbooks
        resource:
          type: string
          description: Unified API resource name
          example: AgedDebtors
        operation:
          type: string
          description: Operation performed
          example: one
        data:
          $ref: '#/components/schemas/AgedDebtors'
        _raw:
          $ref: '#/components/schemas/Raw'
    BadRequestResponse:
      type: object
      x-apideck-schema-id: BadRequest
      properties:
        status_code:
          type: number
          description: HTTP status code
          example: 400
        error:
          type: string
          description: Contains an explanation of the status_code as defined in HTTP/1.1 standard (RFC 7231)
          example: Bad Request
        type_name:
          type: string
          description: The type of error returned
          example: RequestValidationError
        message:
          type: string
          description: A human-readable message providing more details about the error.
          example: Invalid Params
          x-speakeasy-error-message: true
        detail:
          anyOf:
          - type: string
            example: Missing property foobar
          - type: object
            x-speakeasy-detail: true
            example:
              missing:
              - foobar: required
          description: Contains parameter or domain specific information related to the error and why it occurred.
        ref:
          type: string
          description: Link to documentation of error type
          example: https://developers.apideck.com/errors#requestvalidationerror
        downstream_errors:
          type: array
          description: Contains downstream errors returned from the connector. Only present when type_name is ConnectorExecutionError.
          items:
            type: object
            properties:
              message:
                type: string
                description: Error message from the downstream provider
              detail:
                type: string
                description: Additional error details
              code:
                type: string
                description: Error code from the downstream provider
          example:
          - message: Account code '100' has been archived or deleted
            detail: Each line item must reference a valid account
            code: VALIDATION_ERROR
    AgedDebtors:
      type: object
      x-apideck-schema-id: AgedDebtors
      additionalProperties: false
      x-apideck-weights:
        report_generated_at: critical
        report_as_of_date: high
        period_count: medium
        period_length: medium
        outstanding_balances: critical
      properties:
        report_generated_at:
          $ref: '#/components/schemas/ReportGeneratedAt'
        report_as_of_date:
          $ref: '#/components/schemas/ReportAsOfDate'
        period_count:
          $ref: '#/components/schemas/PeriodCount'
        period_length:
          $ref: '#/components/schemas/PeriodLength'
        outstanding_balances:
          type: array
          items:
            $ref: '#/components/schemas/OutstandingBalanceByCustomer'
    PeriodLength:
      type: integer
      title: Period Length
      description: Length of each aging period in days.
      example: 30
      default: 30
    OutstandingBalanceByCurrency:
      type: object
      title: Outstanding Balance by Currency
      x-apideck-schema-id: OutstandingBalanceByCurrency
      additionalProperties: false
