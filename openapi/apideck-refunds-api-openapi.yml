openapi: 3.2.0
info:
  version: 10.24.12
  title: Apideck Accounting Refunds API
  description: Welcome to the Accounting API.
  contact:
    email: hello@apideck.com
    url: https://developers.apideck.com
  x-logo:
    url: https://developers.apideck.com/icon.png
  x-apideck-api: accounting
  x-apideck-sdk-support: true
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://unify.apideck.com
security:
- apiKey: []
tags:
- name: Refunds
  description: A Refund represents money returned to a customer, supporting both itemized refunds (with line items) and allocation-based refunds (applied to invoices, credit notes, or overpayments).
  x-apideck-resource-id: refunds
  x-apideck-model:
    $ref: '#/components/schemas/Refund'
paths:
  /accounting/refunds:
    get:
      tags:
      - Refunds
      operationId: refundsAll
      summary: Apideck List Refunds
      description: List Refunds
      parameters:
      - $ref: '#/components/parameters/raw'
      - $ref: '#/components/parameters/consumerId'
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/serviceId'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/refundsFilter'
      - $ref: '#/components/parameters/refundsSort'
      - $ref: '#/components/parameters/passThrough'
      - $ref: '#/components/parameters/fields'
      security:
      - apiKey: []
      x-apideck-gotchas:
      - connector: quickbooks
        description: 'tax_inclusive only applies to UK, AU, IN, and CA editions. US companies ignore this field silently.

          '
      responses:
        '200':
          $ref: '#/components/responses/GetRefundsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '402':
          $ref: '#/components/responses/PaymentRequiredResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/UnprocessableResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      x-apideck-api: accounting
      x-codeSamples:
      - lang: TypeScript
        label: Node
        source: {}
    post:
      tags:
      - Refunds
      operationId: refundsAdd
      summary: Apideck Create Refund
      description: Create Refund
      parameters:
      - $ref: '#/components/parameters/raw'
      - $ref: '#/components/parameters/consumerId'
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/serviceId'
      security:
      - apiKey: []
      x-apideck-gotchas:
      - connector: quickbooks
        description: 'tax_inclusive only applies to UK, AU, IN, and CA editions. US companies ignore this field silently. payment_method_id is required to set the payment method. Provide the ID of a payment method record configured in QuickBooks. total_amount is required on each line item. If not provided, it is computed from quantity * unit_price. tracking_categories behavior depends on company settings. "One to entire transaction" uses top-level tracking_categories. "One to each row" requires tracking_categories on each line item.

          '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refund'
      responses:
        '201':
          $ref: '#/components/responses/CreateRefundResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '402':
          $ref: '#/components/responses/PaymentRequiredResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/UnprocessableResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      x-apideck-api: accounting
      x-codeSamples:
      - lang: TypeScript
        label: Node
        source:
          refund:
            number: RF-00001
            customer:
              id: '12345'
              display_name: Windsurf Shop
              name: Windsurf Shop
              email: boring@boring.com
            company_id: '12345'
            currency: USD
            currency_rate: 0.69
            tax_inclusive: true
            sub_total: 250
            total_amount: 49.99
            total_tax: 25
            refund_date: '2021-05-01T12:00:00.000Z'
            status: paid
            type: refund_receipt
            payment_method: cash
            payment_method_reference: '123456'
            payment_method_id: '12345'
            account:
              id: '123456'
              name: Bank account
              nominal_code: N091
              code: '453'
              parent_id: '123456'
              display_id: '123456'
            line_items:
            - id: '12345'
              row_id: '12345'
              code: 120-C
              line_number: 1
              description: Model Y is a fully electric, mid-size SUV, with seating for up to seven, dual motor AWD and unparalleled protection.
              type: sales_item
              tax_amount: 27500
              total_amount: 27500
              quantity: 1
              unit_price: 27500.5
              unit_of_measure: pc.
              discount_percentage: 0.01
