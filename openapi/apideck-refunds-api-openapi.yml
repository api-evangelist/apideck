              notes: Address notes or delivery instructions.
              row_version: 1-12345
            department:
              display_id: '123456'
              name: Acme Inc.
            location:
              id: '123456'
              display_id: '123456'
              name: New York Office
            tracking_categories:
            - id: '123456'
              code: '100'
              name: New York
              parent_id: '123456'
              parent_name: New York
            custom_fields:
            - id: '2389328923893298'
