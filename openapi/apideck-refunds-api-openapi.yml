                value: New York
              tax_rate:
                id: '123456'
                code: N-T
                rate: 10
              tracking_categories:
              - id: '123456'
                code: '100'
                name: New York
                parent_id: '123456'
                parent_name: New York
              ledger_account:
                id: '123456'
                name: Bank account
                nominal_code: N091
                code: '453'
                parent_id: '123456'
                display_id: '123456'
              custom_fields:
              - id: '2389328923893298'
                name: employee_level
                description: Employee Level
                value: Uses Salesforce and Marketo
              row_version: 1-12345
            allocations:
            - id: '123456'
              type: invoice
              amount: 49.99
              allocation_id: '123456'
            tax_code: '1234'
            discount_percentage: 5.5
            discount_amount: 25
            note: Refund for returned items
            customer_memo: Thank you for your business and have a great day!
            reference: REF-123456
            billing_address:
              id: '123'
              type: primary
              string: 25 Spring Street, Blackburn, VIC 3130
              name: HQ US
              line1: Main street
              line2: 'apt #'
              line3: 'Suite #'
              line4: delivery instructions
              line5: 'Attention: Finance Dept'
              street_number: '25'
              city: San Francisco
              state: CA
              postal_code: '94104'
              country: US
              latitude: '40.759211'
              longitude: '-73.984638'
              county: Santa Clara
              contact_name: Elon Musk
              salutation: Mr
              phone_number: 111-111-1111
              fax: 122-111-1111
              email: elon@musk.com
              website: https://elonmusk.com
              notes: Address notes or delivery instructions.
              row_version: 1-12345
            shipping_address:
              id: '123'
              type: primary
