            status: New
            monetary_amount: 75000
            currency: USD
            fax: '+12129876543'
            websites:
            - id: '12345'
              url: http://example.com
              type: primary
            addresses:
            - id: '123'
              type: primary
              string: 25 Spring Street, Blackburn, VIC 3130
              name: HQ US
              line1: Main street
              line2: 'apt #'
              line3: 'Suite #'
              line4: delivery instructions
