openapi: 3.2.0
info:
  version: 10.24.12
  title: Apideck CRM Opportunities API
  description: Welcome to the CRM API.
  contact:
    email: hello@apideck.com
    url: https://developers.apideck.com
  x-logo:
    url: https://developers.apideck.com/icon.png
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  x-apideck-api: crm
  x-apideck-sdk-support: true
servers:
- url: https://unify.apideck.com
  description: Production
security:
- apiKey: []
  applicationId: []
  consumerId: []
tags:
- name: Opportunities
  description: The Opportunity resource represents potential business deals, including details such as title, value, status, close date, and associated contacts or companies.
  x-apideck-resource-id: opportunities
  x-apideck-model:
    $ref: '#/components/schemas/Opportunity'
paths:
  /crm/opportunities:
    get:
      tags:
      - Opportunities
      operationId: opportunitiesAll
      summary: Apideck List opportunities
      description: List opportunities
      parameters:
      - $ref: '#/components/parameters/raw'
      - $ref: '#/components/parameters/consumerId'
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/serviceId'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/opportunitiesFilter'
      - $ref: '#/components/parameters/opportunitiesSort'
      - $ref: '#/components/parameters/passThrough'
      - $ref: '#/components/parameters/fields'
      security:
      - apiKey: []
      x-apideck-gotchas:
      - connector: hubspot
        description: When using a filter or sorting for opportunities, Hubspot will only return a maximum of 10.000 opportunities and omit the company_id, primary_contact_id, company_id, contact_ids, lead_id and contact_id.
      - connector: salesforce
        description: Salesforce imposes a maximum offset limit of 2000. Exceeding this offset will result in an error from Salesforce. For result sets larger than 2000 items, it is necessary to set the pagination limit to 200, as this will enforce the use of batchSize for pagination. Note that setting a limit lower than 200 will not reduce the batchSize due to Salesforce's minimum batch size policy of 200, as detailed in their documentation [here](https://developer.salesforce.com/docs/atlas.en-us.250.0.api_rest/api_rest/headers_queryoptions.htm) and will have no effect.
      - connector: pipedrive
        description: Pipedrive supports filtering by either title or company_id, but not both simultaneously.
      responses:
        '200':
          $ref: '#/components/responses/GetOpportunitiesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '402':
          $ref: '#/components/responses/PaymentRequiredResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/UnprocessableResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      x-apideck-api: crm
      x-codeSamples:
      - lang: TypeScript
        label: Node
        source: {}
    post:
      tags:
      - Opportunities
      operationId: opportunitiesAdd
      summary: Apideck Create opportunity
      description: Create opportunity
      parameters:
      - $ref: '#/components/parameters/raw'
      - $ref: '#/components/parameters/consumerId'
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/serviceId'
      security:
      - apiKey: []
      x-apideck-gotchas:
      - connector: act
        description: The `primary_contact_id` is required in the request body
      - connector: activecampaign
        description: The `primary_contact_id` is required in the request body
      - connector: copper
        description: The `primary_contact_id` is required in the request body
      - connector: microsoft-dynamics
        description: The `primary_contact_id` is required in the request body
      - connector: pipedrive
        description: The `primary_contact_id` is required in the request body
      - connector: salesforce
        description: The `close_date` and `pipeline_stage_id` are required by Salesforce. If `close_date` is not provided, it defaults to `2021-12-31`.
      - connector: teamleader
        description: The `primary_contact_id` is required in the request body
      - connector: zoho-books
        description: The `primary_contact_id` is required in the request body
      - connector: planhat
        description: The allowed status values are `active`, `won` and `lost`. Default is `active`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Opportunity'
      responses:
        '201':
          $ref: '#/components/responses/CreateOpportunityResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '402':
          $ref: '#/components/responses/PaymentRequiredResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/UnprocessableResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      x-apideck-api: crm
      x-codeSamples:
      - lang: TypeScript
        label: Node
        source:
          opportunity:
            title: New Rocket
            primary_contact_id: '12345'
            description: Opportunities are created for People and Companies that are interested in buying your products or services. Create Opportunities for People and Companies to move them through one of your Pipelines.
            type: Existing Customer - Upgrade
            monetary_amount: 75000
            currency: USD
            win_probability: 40
            close_date: '2020-10-30'
            loss_reason_id: '12345'
            loss_reason: No budget
            won_reason_id: '12345'
            won_reason: Best pitch
            pipeline_id: '12345'
            pipeline_stage_id: '12345'
            source_id: '12345'
            lead_id: '12345'
            lead_source: Website
            contact_id: '12345'
            contact_ids:
            - '12345'
            company_id: '12345'
            company_name: Copper
            owner_id: '12345'
            priority: None
            status: Open
            status_id: '12345'
            tags:
            - New
            custom_fields:
            - id: '2389328923893298'
              name: employee_level
              description: Employee Level
              value: Uses Salesforce and Marketo
            stage_last_changed_at: '2020-09-30T07:43:32.000Z'
            pass_through:
            - service_id: string
              operation_id: string
              extend_object: {}
              extend_paths:
              - path: $.nested.property
                value:
                  TaxClassificationRef:
                    value: EUC-99990201-V1-00020000
  /crm/opportunities/{id}:
    get:
      tags:
      - Opportunities
      operationId: opportunitiesOne
      summary: Apideck Get opportunity
      description: Get opportunity
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/consumerId'
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/serviceId'
      - $ref: '#/components/parameters/raw'
      - $ref: '#/components/parameters/fields'
      security:
      - apiKey: []
      responses:
        '200':
          $ref: '#/components/responses/GetOpportunityResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '402':
          $ref: '#/components/responses/PaymentRequiredResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/UnprocessableResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      x-apideck-api: crm
      x-codeSamples:
      - lang: TypeScript
        label: Node
        source:
          id: id_example
    patch:
      tags:
      - Opportunities
      operationId: opportunitiesUpdate
      summary: Apideck Update opportunity
      description: Update opportunity
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/consumerId'
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/serviceId'
      - $ref: '#/components/parameters/raw'
      security:
      - apiKey: []
      x-apideck-gotchas:
      - connector: planhat
        description: The allowed status values are `active`, `won` and `lost`. Default is `active`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Opportunity'
      responses:
        '200':
          $ref: '#/components/responses/UpdateOpportunityResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '402':
          $ref: '#/components/responses/PaymentRequiredResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/UnprocessableResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      x-apideck-api: crm
      x-codeSamples:
      - lang: TypeScript
        label: Node
        source:
          id: id_example
          opportunity:
            title: New Rocket
            primary_contact_id: '12345'
            description: Opportunities are created for People and Companies that are interested in buying your products or services. Create Opportunities for People and Companies to move them through one of your Pipelines.
            type: Existing Customer - Upgrade
            monetary_amount: 75000
            currency: USD
            win_probability: 40
            close_date: '2020-10-30'
            loss_reason_id: '12345'
            loss_reason: No budget
            won_reason_id: '12345'
            won_reason: Best pitch
            pipeline_id: '12345'
            pipeline_stage_id: '12345'
            source_id: '12345'
            lead_id: '12345'
            lead_source: Website
            contact_id: '12345'
            contact_ids:
            - '12345'
            company_id: '12345'
            company_name: Copper
            owner_id: '12345'
            priority: None
            status: Open
            status_id: '12345'
            tags:
            - New
            custom_fields:
            - id: '2389328923893298'
              name: employee_level
              description: Employee Level
              value: Uses Salesforce and Marketo
            stage_last_changed_at: '2020-09-30T07:43:32.000Z'
            pass_through:
            - service_id: string
              operation_id: string
              extend_object: {}
              extend_paths:
              - path: $.nested.property
                value:
                  TaxClassificationRef:
                    value: EUC-99990201-V1-00020000
    delete:
      tags:
      - Opportunities
      operationId: opportunitiesDelete
      summary: Apideck Delete opportunity
      description: Delete opportunity
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/consumerId'
      - $ref: '#/components/parameters/applicationId'
      - $ref: '#/components/parameters/serviceId'
      - $ref: '#/components/parameters/raw'
      security:
      - apiKey: []
      responses:
        '200':
          $ref: '#/components/responses/DeleteOpportunityResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
