          example: 50
        cursors:
          type: object
          description: Cursors to navigate to previous or next pages through the API
          properties:
            previous:
              type:
              - string
              - 'null'
              description: Cursor to navigate to the previous page of results through the API
              example: em9oby1jcm06OnBhZ2U6OjE=
            current:
              type:
              - string
              - 'null'
              description: Cursor to navigate to the current page of results through the API
              example: em9oby1jcm06OnBhZ2U6OjI=
            next:
              type:
              - string
              - 'null'
              description: Cursor to navigate to the next page of results through the API
              example: em9oby1jcm06OnBhZ2U6OjM=
    UpdateTimeOffRequestResponse:
      type: object
      required:
      - status_code
      - status
      - service
      - resource
      - operation
      - data
      properties:
        status_code:
          type: integer
          description: HTTP Response Status Code
          example: 200
        status:
          type: string
          description: HTTP Response Status
          example: OK
        service:
          type: string
          description: Apideck ID of service provider
          example: bamboohr
        resource:
          type: string
          description: Unified API resource name
          example: time-off-requests
        operation:
          type: string
          description: Operation performed
          example: update
        data:
          $ref: '#/components/schemas/UnifiedId'
        _raw:
          $ref: '#/components/schemas/Raw'
    CreatedBy:
      type:
      - string
      - 'null'
      title: Created by
      description: The user who created the object.
      example: '12345'
      readOnly: true
    TimeOffRequest:
      type: object
      additionalProperties: false
      x-apideck-weights:
        id: high
        employee_id: high
        policy_id: low
        status: high
        description: medium
        start_date: high
        end_date: high
        request_date: medium
        request_type: medium
        approval_date: medium
        units: medium
        amount: medium
        notes: low
        updated_by: edge-case
        created_by: edge-case
        updated_at: medium
        created_at: medium
        policy_type: edge-case
        day_part: edge-case
      properties:
        id:
          $ref: '#/components/schemas/Id'
        employee_id:
          $ref: '#/components/schemas/EmployeeId'
        policy_id:
          type:
          - string
          - 'null'
          title: Policy ID
          description: ID of the policy
          example: '12345'
        status:
          type:
          - string
          - 'null'
          title: Status
          enum:
          - requested
          - approved
          - declined
          - cancelled
          - deleted
          - other
          description: The status of the time off request.
          x-apideck-enum-id: time-off-requests.status
          example: approved
        description:
          type:
          - string
          - 'null'
          title: Description
          description: Description of the time off request.
          example: Enjoying some sun.
        start_date:
          type:
          - string
          - 'null'
          description: The start date of the time off request.
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2022-04-01'
        end_date:
          type:
          - string
          - 'null'
          description: The end date of the time off request.
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2022-04-01'
        request_date:
          type:
          - string
          - 'null'
          description: The date the request was made.
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2022-03-21'
        request_type:
          type:
          - string
          - 'null'
          enum:
          - vacation
          - sick
          - personal
          - jury_duty
          - volunteer
          - bereavement
          - other
          description: The type of request
          x-apideck-enum-id: time-off-requests.type
          example: vacation
        approval_date:
          type:
          - string
          - 'null'
          description: The date the request was approved
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2022-03-21'
        units:
          type:
          - string
          - 'null'
          enum:
          - days
          - hours
          - other
          description: 'The unit of time off requested. Possible values include: `hours`, `days`, or `other`.'
          x-apideck-enum-id: time-off-requests.units
          example: hours
        amount:
          type:
          - number
          - 'null'
          description: The amount of time off requested.
          example: 3.5
        day_part:
          type:
          - string
          - 'null'
          description: The day part of the time off request.
          example: morning
        notes:
          type: object
          properties:
            employee:
              type:
              - string
              - 'null'
              title: Employee note
              example: Relaxing on the beach for a few hours.
            manager:
              type:
              - string
              - 'null'
              title: Manager note
              example: Enjoy!
        custom_mappings:
          $ref: '#/components/schemas/CustomMappings'
        updated_by:
          $ref: '#/components/schemas/UpdatedBy'
        created_by:
          $ref: '#/components/schemas/CreatedBy'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        pass_through:
          $ref: '#/components/schemas/PassThroughBody'
        policy_type:
          $ref: '#/components/schemas/PolicyType'
    GetTimeOffRequestResponse:
      type: object
      required:
      - status_code
      - status
      - service
      - resource
      - operation
      - data
      properties:
        status_code:
          type: integer
          description: HTTP Response Status Code
          example: 200
        status:
          type: string
          description: HTTP Response Status
          example: OK
        service:
          type: string
          description: Apideck ID of service provider
          example: bamboohr
        resource:
          type: string
          description: Unified API resource name
          example: time-off-requests
        operation:
          type: string
          description: Operation performed
          example: one
        data:
          $ref: '#/components/schemas/TimeOffRequest'
        _raw:
          $ref: '#/components/schemas/Raw'
    NotFoundResponse:
      type: object
      x-apideck-schema-id: NotFound
      properties:
        status_code:
          type: number
          description: HTTP status code
          example: 404
        error:
          type: string
          description: Contains an explanation of the status_code as defined in HTTP/1.1 standard (RFC 7231)
          example: Not Found
        type_name:
          type: string
          description: The type of error returned
          example: EntityNotFoundError
        message:
          type: string
          description: A human-readable message providing more details about the error.
          example: Unknown Widget
          x-speakeasy-error-message: true
        detail:
          anyOf:
          - type: string
            example: 'Could not find widget with id: ''123'''
          - type: object
            x-speakeasy-detail: true
            example:
              not_found:
                entity: widget
                id: '123'
          description: Contains parameter or domain specific information related to the error and why it occurred.
        ref:
          type: string
          description: Link to documentation of error type
          example: https://developers.apideck.com/errors#entitynotfounderror
    Id:
      type: string
      title: ID
      description: A unique identifier for an object.
      example: '12345'
      readOnly: true
    PolicyType:
      type: string
      description: The policy type of the time off request
      example: sick
    UnprocessableResponse:
      type: object
      x-apideck-schema-id: Unprocessable
      properties:
        status_code:
          type: number
          description: HTTP status code
          example: 422
        error:
          type: string
          description: Contains an explanation of the status_code as defined in HTTP/1.1 standard (RFC 7231)
          example: Unprocessable Entity
        type_name:
          type: string
          description: The type of error returned
          example: InvalidStateError
        message:
          type: string
          description: A human-readable message providing more details about the error.
          example: Invalid State
          x-speakeasy-error-message: true
        detail:
          anyOf:
          - type: string
            example: Unprocessable request, please verify your request headers and body.
          - type: object
            x-speakeasy-detail: true
            example:
              error: Unprocessable
              message: Unprocessable request, please verify your request headers and body.
          description: Contains parameter or domain specific information related to the error and why it occurred.
        ref:
          type: string
          description: Link to documentation of error type
          example: https://developers.apideck.com/errors#invalidstateerror
    Links:
      type: object
      x-apideck-schema-id: Links
      description: Links to navigate to previous or next pages through the API
      properties:
        previous:
          type:
          - string
          - 'null'
          description: Link to navigate to the previous page through the API
          example: https://unify.apideck.com/crm/companies?cursor=em9oby1jcm06OnBhZ2U6OjE%3D
        current:
          type: string
          description: Link to navigate to the current page through the API
          example: https://unify.apideck.com/crm/companies
        next:
          type:
          - string
          - 'null'
          description: Link to navigate to the previous page through the API
          example: https://unify.apideck.com/crm/companies?cursor=em9oby1jcm06OnBhZ2U6OjM
    TimeOffRequestsFilter:
      type: object
      example:
        start_date: '2022-04-08'
        end_date: '2022-04-21'
        updated_since: '2020-09-30T07:43:32.000Z'
        employee_id: '1234'
        time_off_request_status: approved
        company_id: '1234'
      properties:
        start_date:
          type: string
          description: Start date of the date range to filter time off requests. When used with end_date, filters for requests within the specified date range.
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2022-04-08'
        end_date:
          type: string
          description: End date of the date range to filter time off requests. When used with start_date, filters for requests within the specified date range.
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2022-04-21'
        updated_since:
          type: string
          description: Minimum date the time off request was last created or modified
          example: '2020-09-30T07:43:32.000Z'
        employee_id:
          type: string
          description: Employee ID
          example: '1234'
        time_off_request_status:
          type: string
          description: Time off request status to filter on
          example: requested
          enum:
          - requested
          - approved
          - declined
          - cancelled
          - deleted
          - other
        company_id:
          type: string
          description: Company ID
          example: '1234'
      additionalProperties: false
    BadRequestResponse:
      type: object
      x-apideck-schema-id: BadRequest
      properties:
        status_code:
          type: number
          description: HTTP status code
          example: 400
        error:
          type: string
          description: Contains an explanation of the status_code as defined in HTTP/1.1 standard (RFC 7231)
          example: Bad Request
        type_name:
          type: string
          description: The type of error returned
          example: RequestValidationError
        message:
          type: string
          description: A human-readable message providing more details about the error.
          example: Invalid Params
          x-speakeasy-error-message: true
        detail:
          anyOf:
          - type: string
            example: Missing property foobar
          - type: object
            x-speakeasy-detail: true
            example:
              missing:
              - foobar: required
          description: Contains parameter or domain specific information related to the error and why it occurred.
        ref:
          type: string
          description: Link to documentation of error type
          example: https://developers.apideck.com/errors#requestvalidationerror
        downstream_errors:
          type: array
